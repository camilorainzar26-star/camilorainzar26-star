<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Camilo Daza Rainzar  Full-Stack &amp; AI/ML Engineer</title>
  <desc id="desc">GitHub profile banner for Camilo Daza Rainzar, a Full-Stack and AI/ML engineer based in Bucaramanga, Colombia.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>
  <circle cx="980" cy="70" r="160" fill="url(#glow)" filter="url(#soft)"/>
  <circle cx="180" cy="320" r="120" fill="url(#glow)" filter="url(#soft)"/>
  <rect width="1200" height="380" fill="url(#vignette)"/>

  <g opacity="0.85" stroke="#22D3EE" stroke-width="1.2" fill="none">
    <circle cx="980" cy="86" r="4" fill="#22D3EE"/>
    <circle cx="1048" cy="142" r="3.2" fill="#818CF8"/>
    <circle cx="930" cy="168" r="3" fill="#67E8F9"/>
    <circle cx="1090" cy="210" r="3.4" fill="#A5B4FC"/>
    <circle cx="1008" cy="236" r="2.8" fill="#22D3EE"/>
    <path d="M980 86 L1048 142 L1090 210 L1008 236 L930 168 Z" stroke-opacity="0.45"/>
    <path d="M980 86 L930 168" stroke-opacity="0.35"/>
    <path d="M1048 142 L1008 236" stroke-opacity="0.35"/>
  </g>

  <rect x="56" y="58" width="86" height="4" rx="2" fill="url(#accent)"/>
  <text x="56" y="98" fill="#94A3B8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="4">BUCARAMANGA, COLOMBIA</text>
  <text x="56" y="168" fill="#F8FAFC" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="700">Camilo Daza Rainzar</text>
  <text x="56" y="214" fill="#CBD5E1" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22">Full-Stack &amp; AI/ML Engineer</text>
  <text x="56" y="248" fill="#94A3B8" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="16">Semantic search · recommendation systems · cloud-native platforms</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="286" width="154" height="36" rx="18" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="133" y="309" text-anchor="middle" fill="#E2E8F0">AI inference</text>
    <rect x="222" y="286" width="176" height="36" rx="18" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="310" y="309" text-anchor="middle" fill="#E2E8F0">Realtime pipelines</text>
    <rect x="410" y="286" width="168" height="36" rx="18" fill="#0F172A" stroke="#67E8F9" stroke-opacity="0.4"/>
    <text x="494" y="309" text-anchor="middle" fill="#E2E8F0">Cloud &amp; IaC</text>
  </g>

  <rect x="0" y="376" width="1200" height="4" fill="url(#accent)"/>
</svg>
